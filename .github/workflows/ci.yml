name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Lint has pre-existing debt; fail the job only on new blocking errors when cleaned up.
      - run: npm run lint
        continue-on-error: true
